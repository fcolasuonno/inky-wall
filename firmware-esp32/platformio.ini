; Tesserae MQTT client for the Inky Impression 13.3" on a classic ESP32
; (ESP32-D0WD-V3, 4 MB flash, CP2102 USB-UART, onboard 18650 holder).
;
; This is a port of ../firmware/ (which targets the FireBeetle 2 ESP32-S3).
; The ESP32 has no usable PSRAM, so the driver streams each frame straight to
; the panel's two controllers - no framebuffer anywhere.

[env]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 115200
lib_deps =
  knolleary/PubSubClient@^2.8
; default.csv (the esp32dev default) already provides two OTA app partitions,
; which ArduinoOTA needs. Keep it - do not switch to a no-OTA table.
board_build.partitions = default.csv

; Production: one wake, one MQTT session, paint only if the frame URL changed,
; then deep sleep for the server-configured interval.
[env:tesserae]

; Bench variant: never deep-sleeps, keeps printing over USB-UART.
[env:tesserae-bench]
build_flags = ${env.build_flags} -DDEBUG_NO_SLEEP

; OTA upload: only works while the device is in its ArduinoOTA window
; (publish the retained command from the Tesserae plugin, then press Button A).
; Set INKY_OTA_PASSWORD to OTA_PASSWORD in src/secrets.h before uploading.
; Override upload_port with the panel's current IP if mDNS doesn't resolve.
[env:tesserae-ota]
extends = env:tesserae
upload_protocol = espota
upload_port = inky13-ota.local
upload_flags =
  --auth=${sysenv.INKY_OTA_PASSWORD}
