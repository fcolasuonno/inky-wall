; Tesserae MQTT client for the Inky Impression 13.3" on a FireBeetle 2 ESP32-S3.
;
; This module (N4) has no usable PSRAM, so the driver streams each frame straight
; to the panel's two controllers - no framebuffer anywhere.

[env]
platform = espressif32
board = dfrobot_firebeetle2_esp32s3
framework = arduino
monitor_speed = 115200
lib_deps =
  knolleary/PubSubClient@^2.8
; USB_MODE=0 (TinyUSB CDC console): the HWCDC / USB-Serial-JTAG console path
; (USB_MODE=1) never delivered Serial output on this board. The board manifest
; sets USB_MODE=1, so unflag it first or gcc warns about the redefinition.
build_unflags =
  -DARDUINO_USB_MODE=1
build_flags =
  -DARDUINO_USB_MODE=0
  -DARDUINO_USB_CDC_ON_BOOT=1
board_build.arduino.memory_type = qio_qspi

; Production: one wake, one MQTT session, paint only if the frame URL changed,
; then deep sleep for the server-configured interval.
[env:tesserae]

; Bench variant: never deep-sleeps, keeps printing over USB.
[env:tesserae-bench]
build_flags = ${env.build_flags} -DDEBUG_NO_SLEEP
