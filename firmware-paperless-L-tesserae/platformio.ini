; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = epd13

[env]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.37/platform-espressif32.zip
framework = arduino
board = esp32-c6-devkitm-1
monitor_speed = 115200
upload_speed = 921600
board_build.partitions = part.csv
extra_scripts = pre:set_env.py
lib_ignore = 
	BLE
	BluetoothSerial
	SimpleBLE
	WiFiProv
lib_deps = 
	knolleary/PubSubClient@^2.8
	https://github.com/smarthomeagentur/GxEPD2.git
	https://github.com/smarthomeagentur/SerialFlash.git
	adafruit/Adafruit GFX Library@^1.11.11
	bblanchon/ArduinoJson@^7.3.0
	olikraus/U8g2_for_Adafruit_GFX@^1.8.0
	ldab/KXTJ3-1057@^0.1.1
	h2zero/NimBLE-Arduino@^2.3.4
	ricmoo/QRCode@^0.0.1
	bitbank2/JPEGDEC@^1.8.4
	greiman/SdFat @ ^2.2.2

[env:epd7]
build_flags = -DEPD_TYPE_7INCH

[env:epd13]
build_flags = -DEPD_TYPE_13INCH

; OTA upload: only works while the device is in its ArduinoOTA window
; (publish the retained command from the Tesserae admin plugin, then wait for a wake).
; Set INKY_OTA_PASSWORD to OTA_PASSWORD in src/secrets.h before uploading.
; Override upload_port with the device's current IP if mDNS doesn't resolve.
[env:tesserae-ota]
extends = env:epd13
upload_protocol = espota
upload_port = paperless-L-ota.local
upload_flags =
  --auth=${sysenv.INKY_OTA_PASSWORD}

